<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nike Air Max 90 — ShopProject</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header"><div class="site-header__inner"><a class="site-header__logo" href="index.html">ShopProject</a></div></header>
    <main class="container">
        <nav class="breadcrumbs">
            <span class="breadcrumbs__item"><a href="index.html" class="breadcrumbs__link">Главная</a></span>
            <span class="breadcrumbs__item"><a href="catalog.html" class="breadcrumbs__link">Каталог</a></span>
            <span class="breadcrumbs__item breadcrumbs__item--current">Nike Air Max 90</span>
        </nav>
        <div class="product-view">
            <div class="product-view__gallery">
                <img class="product-view__img" src="https://unsplash.com" alt="Nike Air Max 90">
            </div>
            <section class="product-view__info">
                <h1>Nike Air Max 90</h1>
                <p class="product-view__price">14 990 ₽</p>
                <p>Легендарная амортизация Air Max и премиальные материалы верха для повседневного комфорта.</p>
                <a href="order.html" class="button">Купить модель</a>
                <table class="specs-table">
                    <thead><tr><th>Параметр</th><th>Значение</th></tr></thead>
                    <tbody>
                        <tr><td>Бренд</td><td>Nike</td></tr>
                        <tr><td>Материал</td><td>Кожа, текстиль</td></tr>
                    </tbody>
                </table>
            </section>
        </div>
    </main>
</body>
</html>
